<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>墨白 InkWhite</title>
  <desc>A refined black and white adaptive letter A on a split rounded square, with soft glow and stroke.</desc>
  <defs>
    <clipPath id="tile"><rect x="56" y="56" width="400" height="400" rx="112"/></clipPath>
    <clipPath id="left"><rect x="0" y="0" width="256" height="512"/></clipPath>
    <clipPath id="right"><rect x="256" y="0" width="256" height="512"/></clipPath>
    <filter id="soft-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <path id="letter" fill-rule="evenodd" d="M110 382 218 126H294L402 382H328L308 330H204L184 382ZM226 272H286L256 192Z"/>
  </defs>
  <rect x="56" y="56" width="400" height="400" rx="112" fill="#FFFFFF" opacity="0.10" filter="url(#soft-glow)"/>
  <g clip-path="url(#tile)">
    <rect x="56" y="56" width="400" height="400" fill="#F5F7FA"/>
    <rect x="56" y="56" width="200" height="400" fill="#111318"/>
    <use href="#letter" fill="#FFFFFF" filter="url(#soft-glow)" opacity="0.35" clip-path="url(#left)"/>
    <use href="#letter" fill="#111318" filter="url(#soft-glow)" opacity="0.20" clip-path="url(#right)"/>
    <use href="#letter" fill="#FFFFFF" clip-path="url(#left)"/>
    <use href="#letter" fill="#111318" clip-path="url(#right)"/>
    <use href="#letter" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="3" stroke-linejoin="round" clip-path="url(#left)"/>
    <use href="#letter" fill="none" stroke="#111318" stroke-opacity="0.30" stroke-width="3" stroke-linejoin="round" clip-path="url(#right)"/>
  </g>
  <rect x="57" y="57" width="398" height="398" rx="111" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="2"/>
</svg>
